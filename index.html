<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RwandaCast - Menya ikirere cyawe, buri munsi</title>
  <link href="src/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-pink-50 dark:bg-black transition-colors duration-300">
  <div class="min-h-screen">
    <div class="mx-auto px-4 py-6 max-w-6xl">
      <!-- Header -->
      <header class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl font-semibold text-pink-600 dark:text-pink-400">RwandaCast</h1>
          <p class="text-sm text-pink-500 dark:text-pink-300">Menya ikirere cyawe, buri munsi</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-locate" class="px-3 py-2 bg-pink-600 text-white rounded-md hover:bg-pink-700 transition">Use my location</button>
        </div>
      </header>

      <!-- Search Section -->
      <section class="mb-8 relative max-w-2xl">
        <div class="relative">
          <input 
            id="search-input" 
            type="text" 
            placeholder="Search city in Rwanda..." 
            class="w-full px-4 py-3 text-base bg-white rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-900 placeholder-gray-500"
          />
        </div>
        <ul id="suggestions" class="absolute z-20 w-full mt-2 bg-white rounded-md shadow border border-gray-200 hidden overflow-hidden"></ul>
      </section>

      <!-- Weather Images Slideshow -->
      <section class="mb-8">
        <div id="weather-slideshow" class="relative rounded-lg overflow-hidden shadow-lg">
          <div class="weather-bg h-64 md:h-80 relative">
            <div id="slideshow-container" class="absolute inset-0 flex items-center justify-center">
              <!-- Slideshow images will be inserted here -->
            </div>
            <div class="absolute inset-0 bg-black bg-opacity-30"></div>
            <div class="absolute bottom-4 left-4 text-white">
              <h3 class="text-xl font-semibold">RwandaCast</h3>
              <p class="text-sm opacity-90">Menya ikirere cyawe, buri munsi</p>
            </div>
            <div class="absolute bottom-4 right-4 flex space-x-2">
              <button id="prev-slide" class="bg-white bg-opacity-20 backdrop-blur-sm text-white p-2 rounded-full hover:bg-opacity-30 transition">
                ←
              </button>
              <button id="next-slide" class="bg-white bg-opacity-20 backdrop-blur-sm text-white p-2 rounded-full hover:bg-opacity-30 transition">
                →
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Main Content -->
      <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Current Weather & Forecast -->
        <section class="lg:col-span-2 space-y-6">
          <div id="current" class="rounded-md border border-pink-200 dark:border-pink-800 bg-white dark:bg-black p-4">
            <div class="text-pink-500 dark:text-pink-300">Search a city to see current weather.</div>
          </div>

          <div id="forecast" class="rounded-md border border-pink-200 dark:border-pink-800 bg-white dark:bg-black p-4">
            <div class="text-pink-500 dark:text-pink-300">Forecast will appear here.</div>
          </div>
        </section>

        <!-- Sidebar -->
        <aside class="space-y-4">
          <div class="rounded-md border border-pink-200 dark:border-pink-800 bg-white dark:bg-black p-4">
            <h2 class="text-base font-medium text-pink-600 dark:text-pink-400 mb-2">Favorites</h2>
            <ul id="favorites" class="space-y-2">
              <li class="text-pink-500 dark:text-pink-300 text-sm text-center py-2">No favorites yet</li>
            </ul>
          </div>
        </aside>
      </main>
    </div>
  </div>
  <script src="src/app.js"></script>
</body>
</html>
