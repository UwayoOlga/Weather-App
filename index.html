<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherFlow - Premium Weather App</title>
  <link href="src/output.css" rel="stylesheet">
</head>
<body class="min-h-screen weather-bg">
  <div class="min-h-screen relative z-10">
    <div class="container mx-auto px-6 py-8 max-w-7xl">
      <!-- Header -->
      <header class="flex items-center justify-between mb-12 slide-in">
        <div>
          <h1 class="text-5xl font-bold gradient-text mb-3">WeatherFlow</h1>
          <p class="text-white/90 text-lg font-light">Discover weather like never before</p>
        </div>
        <div class="flex items-center gap-4">
          <button id="btn-locate" class="group px-6 py-3 glass-card text-white rounded-2xl hover:bg-white/20 transition-all duration-300 transform hover:scale-105 flex items-center gap-3">
            <span class="text-xl group-hover:animate-pulse">📍</span>
            <span class="font-medium">My Location</span>
          </button>
        </div>
      </header>

      <!-- Search Section -->
      <section class="mb-12 relative max-w-3xl mx-auto slide-in">
        <div class="relative group">
          <input 
            id="search-input" 
            type="text" 
            placeholder="Search for any city worldwide..." 
            class="w-full px-8 py-6 text-xl glass-card rounded-3xl border-0 focus:outline-none focus:ring-4 focus:ring-white/30 shadow-2xl placeholder-white/60 text-white font-medium transition-all duration-300"
          />
          <div class="absolute right-6 top-1/2 transform -translate-y-1/2 text-white/70 text-2xl group-hover:text-white transition-colors duration-300">
            🔍
          </div>
        </div>
        <ul id="suggestions" class="absolute z-30 w-full mt-4 glass-card rounded-3xl shadow-2xl border border-white/20 hidden overflow-hidden slide-in"></ul>
      </section>

      <!-- Main Content -->
      <main class="grid grid-cols-1 xl:grid-cols-5 gap-8">
        <!-- Current Weather & Forecast -->
        <section class="xl:col-span-4 space-y-8">
          <div id="current" class="glass-card rounded-3xl p-10 slide-in">
            <div class="text-white/80 text-center py-16">
              <div class="text-8xl mb-6 floating-animation">🌤️</div>
              <p class="text-2xl font-light">Search for a city to see beautiful weather data</p>
              <p class="text-white/60 mt-2">Powered by advanced meteorological models</p>
            </div>
          </div>

          <div id="forecast" class="glass-card rounded-3xl p-10 slide-in">
            <div class="text-white/80 text-center py-12">
              <p class="text-xl font-light">5-day detailed forecast will appear here</p>
            </div>
          </div>
        </section>

        <!-- Sidebar -->
        <aside class="space-y-8">
          <div class="glass-card rounded-3xl p-8 slide-in">
            <h2 class="text-2xl font-semibold text-white mb-6 flex items-center gap-3">
              <span class="text-3xl">⭐</span>
              <span>Favorites</span>
            </h2>
            <ul id="favorites" class="space-y-4">
              <li class="text-white/70 text-center py-8">
                <div class="text-4xl mb-3">🌟</div>
                <p class="font-light">No favorites yet</p>
                <p class="text-sm text-white/50 mt-1">Save cities you love</p>
              </li>
            </ul>
          </div>
        </aside>
      </main>
    </div>
  </div>
  <script src="src/app.js"></script>
</body>
</html>
