<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherFlow - Premium Weather App</title>
  <link href="src/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-50">
  <div class="min-h-screen">
    <div class="mx-auto px-4 py-6 max-w-6xl">
      <!-- Header -->
      <header class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl font-semibold text-gray-900">Weather</h1>
          <p class="text-sm text-gray-500">Simple, clean and accurate</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-locate" class="px-3 py-2 bg-gray-900 text-white rounded-md hover:bg-black transition">Use my location</button>
        </div>
      </header>

      <!-- Search Section -->
      <section class="mb-8 relative max-w-2xl">
        <div class="relative">
          <input 
            id="search-input" 
            type="text" 
            placeholder="Search city..." 
            class="w-full px-4 py-3 text-base bg-white rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-900 placeholder-gray-500"
          />
        </div>
        <ul id="suggestions" class="absolute z-20 w-full mt-2 bg-white rounded-md shadow border border-gray-200 hidden overflow-hidden"></ul>
      </section>

      <!-- Main Content -->
      <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Current Weather & Forecast -->
        <section class="lg:col-span-2 space-y-6">
          <div id="current" class="rounded-md border border-gray-200 bg-white p-4">
            <div class="text-gray-500">Search a city to see current weather.</div>
          </div>

          <div id="forecast" class="rounded-md border border-gray-200 bg-white p-4">
            <div class="text-gray-500">Forecast will appear here.</div>
          </div>
        </section>

        <!-- Sidebar -->
        <aside class="space-y-4">
          <div class="rounded-md border border-gray-200 bg-white p-4">
            <h2 class="text-base font-medium text-gray-900 mb-2">Favorites</h2>
            <ul id="favorites" class="space-y-2">
              <li class="text-gray-500 text-sm text-center py-2">No favorites yet</li>
            </ul>
          </div>
        </aside>
      </main>
    </div>
  </div>
  <script src="src/app.js"></script>
</body>
</html>
